# InsightForge agent runtime local configuration template.
# Keep real keys out of commits. Prefer environment variables for shared or CI usage.

llm:
  model_provider: openai
  model: <YOUR_LLM_MODEL>
  base_url: <YOUR_LLM_BASE_URL>
  api_key: ''

image:
  model: <YOUR_IMAGE_MODEL>
  # Supported providers (auto-detected from base_url):
  #   Volcano Engine Ark: https://ark.cn-beijing.volces.com/api/v3
  #   OpenRouter:         https://openrouter.ai/api/v1
  #   Yunwu proxy:        https://yunwu.ai
  base_url: <YOUR_IMAGE_BASE_URL>
  api_key: ''

video:
  # Main model (used for all modes if t2v_model/i2v_model are not set).
  # For Volcano Engine, you can also use an Endpoint ID like ep-xxx.
  model: <YOUR_VIDEO_MODEL>
  # Optional: separate model IDs for text-to-video and image-to-video
  # t2v_model: <YOUR_T2V_MODEL>
  # i2v_model: <YOUR_I2V_MODEL>
  # Supported providers (auto-detected from base_url):
  #   Volcano Engine Ark: https://ark.cn-beijing.volces.com/api/v3
  #   OpenRouter:         https://openrouter.ai/api/v1
  #   Yunwu proxy:        https://yunwu.ai
  base_url: <YOUR_VIDEO_BASE_URL>
  api_key: ''

# Optional. Fill these only when using novel2video planning.
embedding:
  model_provider: openai
  model: <YOUR_EMBEDDING_MODEL>
  base_url: <YOUR_EMBEDDING_BASE_URL>
  api_key: ''

# Optional. Fill these only when using novel2video planning.
reranker:
  model: <YOUR_RERANKER_MODEL>
  base_url: <YOUR_RERANKER_BASE_URL>
  api_key: ''
